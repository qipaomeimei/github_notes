{% extends "base.html" %}
{% block title %}确认删除 · StudyTask{% endblock %}

{% block content %}
<section class="panel panel-narrow">
  <h1 class="panel-title">确认删除任务</h1>
  <p class="confirm-text">确定要删除任务“<strong>{{ task.title }}</strong>”吗？删除后无法恢复。</p>
  <dl class="detail-list">
    <dt>所属课程</dt><dd>{{ task.course }}</dd>
    <dt>截止日期</dt><dd>{{ task.due_date }}</dd>
    <dt>状态</dt><dd>{{ task.status }}</dd>
  </dl>
  <div class="form-actions">
    <form method="post" action="{{ url_for('delete_task', task_id=task.id) }}">
      <button class="btn btn-danger" type="submit">确认删除</button>
    </form>
    <a class="btn btn-ghost" href="{{ url_for('task_detail', task_id=task.id) }}">取消</a>
  </div>
</section>
{% endblock %}
