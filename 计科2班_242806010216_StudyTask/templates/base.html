<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyTask 学习任务管理{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">ST</span>
        <span>StudyTask 学习任务管理</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}">任务列表</a>
        <a class="btn btn-primary btn-sm" href="{{ url_for('new_task') }}">+ 新建任务</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer wrap">
    <span>StudyTask · 单用户本地学习任务管理 · 数据保存在本地 SQLite</span>
  </footer>
</body>
</html>
