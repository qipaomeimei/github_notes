{% extends "base.html" %}
{% block title %}登录 · CampusEvent{% endblock %}
{% block content %}
<div class="login-wrap">
  <section class="card login-card">
    <h1>登录 CampusEvent</h1>
    <p class="muted">校园活动发布、报名与审核系统。使用下方演示账号直接登录。</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <label>
        用户名
        <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      </label>
      <label>
        密码
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <div class="demo-accounts">
      <h2>演示账号</h2>
      <ul>
        <li><code>admin</code> / <code>admin123</code><span>管理员</span></li>
        <li><code>s001</code> / <code>123456</code><span>学生 张三</span></li>
        <li><code>s002</code> / <code>123456</code><span>学生 李四</span></li>
        <li><code>s003</code> / <code>123456</code><span>学生 王五</span></li>
      </ul>
    </div>
  </section>
</div>
{% endblock %}
