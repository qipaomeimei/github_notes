{% extends "base.html" %}
{% block title %}{{ code }} · CampusEvent{% endblock %}
{% block content %}
<div class="card empty error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ message }}</h1>
  <p class="muted">你可以返回上一页，或回到活动广场。</p>
  <p>
    <a class="btn btn-primary" href="{{ url_for('student.index') }}">返回首页</a>
    <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
  </p>
</div>
{% endblock %}
